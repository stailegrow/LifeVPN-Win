# Сборка и публикация релиза.
#
# Новая версия = поменять "version" в package.json и отправить коммит.
# GitHub соберёт установщик и zip для Windows x64 и выложит релиз
# v<версия> — а установленные копии Life VPN подхватят его сами.
name: Release

on:
  # На любой коммит в main: если релиз этой версии уже есть, сборка
  # пропускается за пару секунд.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Версия
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Релиз уже есть?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'false'
        with:
          node-version: 22

      - name: Зависимости и ядро
        if: steps.check.outputs.exists == 'false'
        run: |
          npm ci
          ./scripts/fetch-xray.sh

      - name: Проверки
        if: steps.check.outputs.exists == 'false'
        run: npm test

      - name: Сборка
        if: steps.check.outputs.exists == 'false'
        run: npx electron-builder --win --x64 --publish never

      - name: Публикация
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          V="${{ steps.v.outputs.version }}"
          ASSETS=("dist/LifeVPN-Setup-$V.exe" "dist/LifeVPN-$V-x64.zip")
          # Подпись издателя: без неё приложение не ставит обновление само,
          # а открывает страницу релиза. Ключ — секрет UPDATE_SIGNING_KEY.
          if [ -n "$UPDATE_SIGNING_KEY" ]; then
            node scripts/sign-update.js "$V" "dist/LifeVPN-Setup-$V.exe" > "dist/LifeVPN-Setup-$V.exe.sig"
            ASSETS+=("dist/LifeVPN-Setup-$V.exe.sig")
          else
            echo "::warning title=Нет подписи::Секрет UPDATE_SIGNING_KEY не задан — релиз без .sig, автообновление 3.1.5+ на него не встанет."
          fi
          gh release create "v$V" "${ASSETS[@]}" \
            --title "Life VPN $V для Windows" \
            --notes-file scripts/release-notes.md
